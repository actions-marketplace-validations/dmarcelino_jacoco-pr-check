name: 'JaCoCo Report'
description: 'Publishes the JaCoCo coverage report as a check run on the Pull Request head commit'
inputs:
  paths:
    description: 'Comma separated paths of the generated jacoco xml files (supports wildcard glob pattern)'
    required: true
  token:
    description: Github token used to read the changed files and create the check run (defaults to automatic token, make sure the job permissions grant checks write and contents read)
    required: false
    default: ${{ github.token }}
  min-coverage-overall:
    description: 'The minimum code coverage that is required to pass for overall project'
    required: false
    default: '80'
  min-coverage-changed-lines:
    description: 'The minimum code coverage that is required to pass for changed lines'
    required: false
    default: '80'
  check-name:
    description: 'The name of the check run. The check title shows the overall coverage and, when coverage dropped, the delta (e.g. Overall 69.09% (-1.07%)).'
    required: false
    default: 'JaCoCo Report'
  fail-check-below-threshold:
    description: 'If true, the check run is marked as failed when overall or changed-lines coverage is below the configured minimum.'
    required: false
    default: 'false'
  pr-number:
    description: 'The PR whose base and head SHAs are used for comparing changes. Useful for workflow_run, schedule and workflow_dispatch events.'
    required: false
  pass-emoji:
    description: 'Github emoji used in the check report for pass status, when coverage is greater than or equal to min coverage (should be a Github supported emoji)'
    required: false
    default: ':green_apple:'
  fail-emoji:
    description: 'Github emoji used in the check report for fail status, when coverage is lower than min coverage (should be a Github supported emoji)'
    required: false
    default: ':x:'
  continue-on-error:
    description: 'When there is an error do not fail the action, but log a warning'
    required: false
    default: 'true'
  coverage-counter-type:
    description: 'The type of JaCoCo counter to use for coverage calculation (INSTRUCTION, BRANCH, LINE, COMPLEXITY, METHOD). Note: COMPLEXITY and METHOD are not available at per-line granularity, so changed-lines coverage will fall back to INSTRUCTION for those types.'
    required: false
    default: 'INSTRUCTION'
  show-all-modules:
    description: 'If true, show coverage for all modules in the check report, not just those with changed files'
    required: false
    default: 'false'
  show-missing-lines:
    description: 'If true, show the line numbers of uncovered code in the Files table of the check report with hyperlinks'
    required: false
    default: 'true'
  debug-mode:
    description: 'Run the action in debug mode and get debug logs printed in console'
    required: false
    default: 'false'
  head-sha:
    description: 'The head SHA to use for comparing changes. Useful when the head SHA is not available in the context (e.g. PRs from forks via workflow_run).'
    required: false
  base-sha:
    description: 'The base SHA to use for comparing changes. Useful when the base SHA is not available in the context (e.g. PRs from forks via workflow_run).'
    required: false

outputs:
  coverage-overall:
    description: 'The overall coverage of the project'
  coverage-changed-lines:
    description: 'The coverage of lines that were changed in the PR'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'percent'
  color: 'green'
